<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD HAND — Connexion</title>
<style>
:root{
  --bg:#08080b;--panel:#121219;--panel2:#0e0e13;--border:#23232e;--text:#e7e7ee;
  --muted:#8a8a99;--accent:#ff2d4a;--accent2:#ff6a3d;--ok:#35d07f;--err:#ff4d5e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);min-height:100vh;
 display:flex;align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(1100px 560px at 50% -10%,rgba(255,45,74,.12),transparent 60%),
 radial-gradient(900px 500px at 90% 110%,rgba(255,106,61,.08),transparent 55%),var(--bg)}
a{color:var(--accent2);text-decoration:none}
.wrap{max-width:420px;width:100%}
.brand{text-align:center;margin-bottom:24px}
.brand h1{font-size:clamp(28px,5vw,46px);letter-spacing:8px;font-weight:800;
 background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;
 text-shadow:0 0 40px rgba(255,45,74,.35)}
.brand p{color:var(--muted);letter-spacing:3px;font-size:12px;text-transform:uppercase;margin-top:4px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);
 border-radius:16px;padding:28px 24px}
.field{margin:18px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
input[type=text],input[type=password]{width:100%;background:#05050a;color:var(--text);
 border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:14px;outline:none}
input:focus{border-color:var(--accent)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:11px;
 padding:14px 20px;font-weight:700;cursor:pointer;font-size:14px;width:100%;margin-top:8px;
 box-shadow:0 8px 26px rgba(255,45,74,.3)}
.btn:hover{transform:translateY(-2px)}
.error{background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.4);border-radius:10px;
 padding:12px 14px;font-size:13px;color:var(--err);margin-bottom:16px}
.foot{text-align:center;margin-top:20px;color:var(--muted);font-size:12px}
.foot a{color:var(--accent2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>GOD&nbsp;HAND</h1><p>Administration DataHub</p></div>
  <div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>Nom d'utilisateur</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" name="password" required>
      </div>
      <input type="hidden" name="next" value="{{ next|default:'/manage/' }}">
      <button type="submit" class="btn">Se connecter</button>
    </form>
  </div>
  <div class="foot">
    <a href="/">← Retour à l'accueil</a>
  </div>
</div>
</body>
</html>
