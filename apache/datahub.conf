<VirtualHost *:80>
    ServerName agent.co-ned.com
    ServerAdmin admin@co-ned.com

    # Redirect to HTTPS
    Redirect permanent / https://agent.co-ned.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName agent.co-ned.com
    ServerAdmin admin@co-ned.com

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/agent.co-ned.com.crt
    SSLCertificateKeyFile /etc/ssl/private/agent.co-ned.com.key
    # SSLCertificateChainFile /etc/ssl/certs/chain.crt

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Proxy to Gunicorn
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Static files (chemins entre guillemets : peuvent contenir un espace)
    Alias /static/ "/path/to/BD AGENT/staticfiles/"
    <Directory "/path/to/BD AGENT/staticfiles">
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/datahub_error.log
    CustomLog ${APACHE_LOG_DIR}/datahub_access.log combined
</VirtualHost>
