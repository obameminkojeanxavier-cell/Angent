# DataHub — vhost pour un déploiement derrière Cloudflare Tunnel.
# Le TLS est terminé par Cloudflare ; le tunnel pointe vers http://localhost:80.
# On ne met donc PAS de vhost 443 ni de certificat ici (ce serait inutile et
# empêcherait Apache de démarrer si les certs sont absents).

<VirtualHost *:80>
    ServerName agent.co-ned.com
    ServerAdmin admin@co-ned.com

    # En-têtes de sécurité (le HSTS est géré par Cloudflare)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"

    # L'origine n'est atteinte que via le tunnel Cloudflare (https) : on force
    # X-Forwarded-Proto pour que Django ne boucle pas en redirection.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On

    # Fichiers statiques servis directement par Apache (pas via le proxy)
    Alias /static/ "/path/to/BD AGENT/staticfiles/"
    <Directory "/path/to/BD AGENT/staticfiles">
        Require all granted
    </Directory>
    ProxyPass /static/ !

    # Tout le reste -> Gunicorn
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/datahub_error.log
    CustomLog ${APACHE_LOG_DIR}/datahub_access.log combined
</VirtualHost>
